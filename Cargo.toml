[workspace]
resolver = "2"
members = [
    "crates/rum-config",
    "crates/rum-rpm",
    "crates/rum-repo",
    "crates/rum-solve",
    "crates/rum-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rum-pm/rum"
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Internal crates
rum-config = { path = "crates/rum-config" }
rum-rpm = { path = "crates/rum-rpm" }
rum-repo = { path = "crates/rum-repo" }
rum-solve = { path = "crates/rum-solve" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
